version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Not dependabot's to move. The test plugin is Home Assistant under
    # another number: unpinned it follows the newest by itself, and its one
    # pin (constraints-oldest.txt) is the oldest release this project
    # supports. The others are libraries whose versions Home Assistant
    # dictates; tools/test_stack.py reads them from the Home Assistant under
    # test, and the newest of each on the package index is the wrong answer.
    ignore:
      - dependency-name: "pytest-homeassistant-custom-component"
      - dependency-name: "aiousbwatcher"
      - dependency-name: "serialx"
      - dependency-name: "dbus-fast"
      - dependency-name: "bleak"
      - dependency-name: "bleak-retry-connector"
      - dependency-name: "habluetooth"
      - dependency-name: "aioesphomeapi"
