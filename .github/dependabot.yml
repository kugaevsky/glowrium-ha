version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Not dependabot's to move. The test plugin is Home Assistant under
    # another number, and its one pin (constraints-oldest.txt, which
    # dependabot reads as a requirements file) is the oldest release this
    # project supports. Home Assistant's own test package, which the newest
    # stack runs on, needs no entry: only tools/stack.py names it, and it
    # follows the newest by itself. Nor do the libraries Home Assistant
    # requires: their versions are written nowhere here - tools/stack.py
    # reads them from the Home Assistant under test.
    ignore:
      - dependency-name: "pytest-homeassistant-custom-component"
