name: Bug report
description: Report a problem with the Glowrium integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you can —
        it makes problems far quicker to reproduce and fix.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.7.1"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Glowrium integration version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Device model
      description: The Glowrium model, e.g. G7, and the model id from the device page, e.g. Glowrium-C051.
      placeholder: "G7"
    validations:
      required: true
  - type: dropdown
    id: bluetooth
    attributes:
      label: Bluetooth connection
      options:
        - Local adapter on the Home Assistant host
        - ESPHome Bluetooth Proxy
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Settings → Devices & services → Glowrium → ⋮ → Download diagnostics,
        and attach the file here. It carries the model id, the firmware, what
        the lamp reported and where the link stands. The integration puts
        neither the coordinates the lamp stores, nor its serial number, nor
        its address into it. Home Assistant adds a header of its own to every
        diagnostics file - its version, the host's time zone, the names of
        your custom integrations - so look it over before attaching.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Settings → Devices & services → Glowrium → ⋮ → Enable debug logging,
        reproduce the problem, then disable it again and take the lines around
        the problem from the log it offers. That covers the integration and
        the Bluetooth libraries under it. This issue is public: the log names
        the lamp by its Bluetooth address, and at debug level the libraries
        name the other devices they hear as well. Blank what you would rather
        not publish.
      render: shell
  - type: textarea
    id: frames
    attributes:
      label: Notify frames (hex), if the state looks wrong
      description: >
        Only needed when entities read `unknown`, show stale values, or the log
        mentions an undecodable frame or trailing bytes. With debug logging on
        for `custom_components.glowrium`, the coordinator prints the raw bytes
        of any frame it could not use — paste those lines. A frame the decoder
        mishandles is the one thing that cannot be guessed at from a
        description, and one real frame has already turned into a fix and a
        regression test. Look before you paste: a frame can carry the
        coordinates the lamp stores. They are the ids `0a` and `0b`, each
        followed by `fb` and eight more bytes - blank those eight.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: The vendor app was disconnected from the lamp while testing (only one BLE connection is allowed at a time).
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
