name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    # One run for one commit: see the same condition in test.yml.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not pinned, on purpose: this is the validator itself, and following
      # its branch is how a new rule is met the day it is made. Home
      # Assistant documents it this way.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # One run for one commit: see the same condition in test.yml.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not pinned, for the same reason; HACS documents it this way.
      - uses: hacs/action@main
        with:
          category: integration
